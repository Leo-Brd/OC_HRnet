<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HRnet - Employee management application. Create and manage employee records efficiently." />
    <meta name="theme-color" content="#1e3a5f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HRnet - Employee Management" />
    <meta property="og:description" content="Create and manage employee records efficiently with HRnet." />
    <link rel="canonical" href="https://hrnet.local" />
    <title>HRnet - Employee Management</title>

    <!-- Critical CSS inline for faster FCP -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root { font-family: system-ui, sans-serif; font-size: 16px; color: #0f172a; background: #f1f5f9; }
      body { min-height: 100vh; }
      html, body, #root { width: 100%; height: 100%; }
    </style>

    <!-- Preconnect to font CDN for faster DNS resolution -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts with optimal display strategy -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet" />
    
    <!-- Preload main JS bundle for better FCP -->
    <link rel="modulepreload" href="/src/main.jsx" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
